# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      run: bun oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      run: bun oxfmt --write {staged_files}
      stage_fixed: true
    - name: drizzle-generate
      glob: "packages/db/src/schema/*"
      run: cd packages/db && bun run db:generate && git add src/migrations
